<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="favNeonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="50%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#0A0F1D" stroke="#00FF88" stroke-width="1.5" stroke-opacity="0.3"/>
  <g filter="url(#favGlow)">
    <!-- Candlestick 1 (Left / H-pillar) -->
    <line x1="14" y1="10" x2="14" y2="38" stroke="#00FF88" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <rect x="11.5" y="16" width="5" height="16" rx="1.5" fill="url(#favNeonGrad)"/>
    
    <!-- Candlestick 2 (Right / H-pillar) -->
    <line x1="34" y1="8" x2="34" y2="36" stroke="#00FF88" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <rect x="31.5" y="12" width="5" height="18" rx="1.5" fill="url(#favNeonGrad)"/>

    <!-- Central Upward Breakout Trend / H-bar -->
    <path d="M14 24 L24 16 L34 20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="16" r="2.5" fill="#00FF88" />
  </g>
</svg>
