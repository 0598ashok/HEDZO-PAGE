<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F28C" />
      <stop offset="100%" stop-color="#00B86B" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F28C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F28C" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2924" />
      <stop offset="100%" stop-color="#0E1714" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Geometric Ascending Crystal / Delta Nodes) -->
  <g transform="translate(4, 8)">
    <!-- Ambient glow circle -->
    <circle cx="24" cy="24" r="22" fill="#00F28C" fill-opacity="0.12" filter="url(#neonGlow)"/>
    
    <!-- Outer Diamond / Hex Shape -->
    <path d="M24 2 L44 14 L44 34 L24 46 L4 34 L4 14 Z" stroke="#00F28C" stroke-width="1.5" stroke-opacity="0.4" fill="url(#darkGrad)"/>
    
    <!-- Inner Ascending Dynamic Polygon / Delta -->
    <path d="M24 8 L38 20 L24 38 L14 26 Z" fill="url(#emeraldGrad)" fill-opacity="0.9"/>
    
    <!-- Accent Highlight Facet -->
    <path d="M24 8 L10 20 L14 26 L24 20 Z" fill="#FFFFFF" fill-opacity="0.25"/>
    <path d="M24 38 L38 20 L32 36 Z" fill="#007F49" fill-opacity="0.6"/>
    
    <!-- Precision Center Trading Crosshair Point -->
    <circle cx="24" cy="24" r="2.5" fill="#FFFFFF" filter="url(#neonGlow)"/>
    <line x1="24" y1="4" x2="24" y2="10" stroke="#00F28C" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="42" y1="24" x2="36" y2="24" stroke="#00F28C" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <!-- Wordmark: HEDZO -->
  <text x="64" y="42" font-family="'Manrope', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="0.08em" fill="#FFFFFF">
    HEDZO
  </text>
  
  <!-- Accent Dot -->
  <circle cx="198" cy="38" r="3" fill="#00F28C" filter="url(#neonGlow)"/>

  <!-- UNI Badge Container -->
  <g transform="translate(210, 18)">
    <rect x="0" y="0" width="58" height="28" rx="6" fill="#00F28C" fill-opacity="0.12" stroke="#00F28C" stroke-width="1.2"/>
    <text x="29" y="19" font-family="'Manrope', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="0.16em" fill="#00F28C" text-anchor="middle">
      UNI
    </text>
  </g>
</svg>
